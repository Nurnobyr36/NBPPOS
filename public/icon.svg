<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-width="6" />

  <!-- Central Graphic Group with shadow -->
  <g filter="url(#dropShadow)">
    <!-- Shopping Bag Body -->
    <rect x="136" y="170" width="240" height="230" rx="36" fill="#ffffff" />
    
    <!-- Bag Fold / Top Trim -->
    <path d="M 136 210 L 376 210" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

    <!-- Bag Handle -->
    <path d="M 196 180 V 130 C 196 96 316 96 316 130 V 180" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" />

    <!-- POS Register / Barcode Accent on Bag -->
    <!-- Barcode Lines -->
    <g fill="#0f766e">
      <rect x="176" y="240" width="10" height="54" rx="4" />
      <rect x="194" y="240" width="18" height="54" rx="4" />
      <rect x="220" y="240" width="8" height="54" rx="3" />
      <rect x="236" y="240" width="22" height="54" rx="4" />
      <rect x="266" y="240" width="12" height="54" rx="4" />
      <rect x="286" y="240" width="8" height="54" rx="3" />
      <rect x="302" y="240" width="16" height="54" rx="4" />
      <rect x="326" y="240" width="10" height="54" rx="4" />
    </g>

    <!-- Scan Line -->
    <line x1="160" y1="267" x2="352" y2="267" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,4" stroke-linecap="round" />

    <!-- Currency / Check Badge -->
    <circle cx="256" cy="340" r="30" fill="url(#goldGrad)" />
    <text x="256" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">৳</text>
  </g>
</svg>
